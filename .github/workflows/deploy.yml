
name: PHP CI/CD - InfinityFree FTP

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:

  deploy:

    name: Test, Backup and Deploy
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT PROJECT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================
      # 2. INSTALL PHP
      # ==========================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # ==========================================
      # 3. TEST ALL PHP FILES
      # ==========================================

      - name: Validate PHP Syntax
        id: validate
        shell: bash
        run: |

          echo "======================================"
          echo "PHP SYNTAX VALIDATION"
          echo "======================================"

          FAIL=0
          COUNT=0

          while IFS= read -r -d '' FILE; do

            echo ""
            echo "Checking: $FILE"

            COUNT=$((COUNT + 1))

            if php -l "$FILE"; then

              echo "PASS: $FILE"

            else

              echo "FAIL: $FILE"
              FAIL=1

            fi

          done < <(git ls-files -z -- '*.php')

          echo ""
          echo "======================================"
          echo "VALIDATION SUMMARY"
          echo "======================================"

          echo "PHP files checked: $COUNT"

          echo "PHP files passed: $((COUNT - FAIL))"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No PHP files found."
            exit 1
          fi

          if [ "$FAIL" -ne 0 ]; then

            echo "ERROR: PHP syntax validation failed."
            exit 1

          fi

          echo "SUCCESS: All PHP files passed."

      # ==========================================
      # 4. REVERT FAILED COMMIT IN GITHUB
      # ==========================================

      - name: Revert Failed Commit
        if: failure() && steps.validate.outcome == 'failure'

        run: |

          echo "======================================"
          echo "PHP VALIDATION FAILED"
          echo "RESTORING PREVIOUS GITHUB VERSION"
          echo "======================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Revert the failed commit

          git revert --no-edit "$GITHUB_SHA"

          # Add skip-ci to prevent another workflow execution

          git commit --amend \
            -m "Revert failed PHP validation [skip ci]"

          # Push the restored version

          git push origin HEAD:main

          echo "Previous GitHub version restored."

      # ==========================================
      # 5. INSTALL FTP CLIENT
      # ==========================================

      - name: Install FTP Client
        if: steps.validate.outcome == 'success'

        run: |

          sudo apt-get update

          sudo apt-get install -y lftp curl

      # ==========================================
      # 6. BACKUP LIVE INFINITYFREE WEBSITE
      # ==========================================

      - name: Backup InfinityFree Website
        id: backup
        if: steps.validate.outcome == 'success'

        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

        run: |

          mkdir -p remote-backup

          echo "======================================"
          echo "BACKING UP LIVE WEBSITE"
          echo "======================================"

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF

          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:list-options -a
          set net:timeout 30
          set net:max-retries 3

          mirror --verbose \
            "$FTP_REMOTE_DIR" \
            "$GITHUB_WORKSPACE/remote-backup"

          bye

          EOF

          echo "ready=true" >> "$GITHUB_OUTPUT"

          echo "Website backup completed."

      # ==========================================
      # 7. DEPLOY ENTIRE PROJECT
      # ==========================================

      - name: Deploy Entire Website Through FTP
        id: deployment
        if: steps.validate.outcome == 'success'

        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

        run: |

          echo "======================================"
          echo "DEPLOYING ENTIRE PROJECT"
          echo "======================================"

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF

          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set net:timeout 30
          set net:max-retries 3

          mirror --reverse \
            --verbose \
            --overwrite \
            --no-perms \
            --parallel=2 \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob .env \
            --exclude-glob '.env.*' \
            ./ \
            "$FTP_REMOTE_DIR/"

          bye

          EOF

          echo "Entire project deployed successfully."

      # ==========================================
      # 8. VERIFY LIVE WEBSITE
      # ==========================================

      - name: Verify Live Website
        id: verification
        if: steps.validate.outcome == 'success'

        env:
          SITE_URL: ${{ secrets.SITE_URL }}

        shell: bash
        run: |

          echo "======================================"
          echo "VERIFYING LIVE WEBSITE"
          echo "======================================"

          HTTP_STATUS=""
          CURL_EXIT=0

          HTTP_STATUS=$(curl \
            --http1.1 \
            -L \
            -sS \
            -o /tmp/website.html \
            -w "%{http_code}" \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SITE_URL") || CURL_EXIT=$?

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$CURL_EXIT" -ne 0 ]; then

            echo "Website connection failed."
            echo "Curl error: $CURL_EXIT"

            exit 1

          fi

          if ! [[ "$HTTP_STATUS" =~ ^[0-9]{3}$ ]]; then

            echo "Invalid HTTP response."
            exit 1

          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 400 ]]; then

            echo "Website verification failed."

            exit 1

          fi

          echo "Website is accessible."

      # ==========================================
      # 9. RESTORE WEBSITE IF DEPLOYMENT FAILS
      # ==========================================

      - name: Rollback InfinityFree Website
        if: failure() && steps.backup.outputs.ready == 'true'

        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

        run: |

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "RESTORING PREVIOUS WEBSITE"
          echo "======================================"

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF

          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:list-options -a
          set net:timeout 30
          set net:max-retries 3

          mirror --reverse \
            --delete \
            --verbose \
            remote-backup/ \
            "$FTP_REMOTE_DIR/"

          bye

          EOF

          echo "Previous website restored."

      # ==========================================
      # 10. FINAL SUMMARY
      # ==========================================

      - name: CI/CD Summary
        if: always()

        run: |

          echo "======================================"
          echo "GITHUB ACTIONS CI/CD SUMMARY"
          echo "======================================"

          echo "Validation: ${{ steps.validate.outcome }}"

          echo "Backup: ${{ steps.backup.outcome }}"

          echo "Deployment: ${{ steps.deployment.outcome }}"

          echo "Verification: ${{ steps.verification.outcome }}"

          echo "======================================"
