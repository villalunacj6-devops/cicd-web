
name: PHP CI/CD - InfinityFree

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:

  # ========================================
  # 1. TEST ALL PHP FILES
  # ========================================

  test:
    name: PHP Syntax Test
    runs-on: ubuntu-latest

    outputs:
      result: ${{ steps.php_test.outputs.result }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP Files
        id: php_test
        shell: bash
        run: |
          echo "================================"
          echo "PHP SYNTAX VALIDATION"
          echo "================================"

          FAILED=0
          COUNT=0

          mapfile -d '' -t FILES < <(
            git ls-files -z -- '*.php'
          )

          for FILE in "${FILES[@]}"; do

            COUNT=$((COUNT + 1))

            echo ""
            echo "Checking: $FILE"

            if php -l "$FILE"; then
              echo "PASS: $FILE"
            else
              echo "FAILED: $FILE"
              FAILED=1
            fi

          done

          echo ""
          echo "PHP FILES CHECKED: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No PHP files found."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "PHP VALIDATION FAILED."
            exit 0
          fi

          echo "result=passed" >> "$GITHUB_OUTPUT"
          echo "ALL PHP FILES PASSED."

  # ========================================
  # 2. ROLLBACK FAILED PHP FILES
  # ========================================

  rollback:
    name: Rollback Failed PHP Files
    needs: test

    if: |
      needs.test.outputs.result == 'failed' &&
      github.event.before != '0000000000000000000000000000000000000000'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Previous PHP Files
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -d '' -t FILES < <(
            git diff --name-only -z \
              "$BEFORE" "$CURRENT" -- '*.php'
          )

          echo "================================"
          echo "ROLLBACK PHP FILES"
          echo "================================"

          for FILE in "${FILES[@]}"; do

            echo "Restoring: $FILE"

            if git cat-file -e "$BEFORE:$FILE" 2>/dev/null; then

              git restore \
                --source="$BEFORE" \
                --staged \
                --worktree \
                -- "$FILE"

            else

              git rm -f --ignore-unmatch -- "$FILE" || true
              rm -f -- "$FILE"

            fi

          done

          if ! git diff --cached --quiet; then

            git commit -m "Rollback failed PHP files [skip ci]"

            git push origin HEAD:main

            echo "ROLLBACK SUCCESSFUL."

          else

            echo "No changed PHP files needed restoration."

          fi

  # ========================================
  # 3. DEPLOY ONLY IF TEST PASSES
  # ========================================

  deploy:
    name: Deploy to InfinityFree
    needs: test

    if: needs.test.outputs.result == 'passed'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FTP Client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy Website
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

        run: |
          echo "================================"
          echo "DEPLOYING WEBSITE"
          echo "================================"

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF

          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set net:timeout 30
          set net:max-retries 3

          mirror --reverse \
            --verbose \
            --overwrite \
            --no-perms \
            --parallel=2 \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob .env \
            --exclude-glob '.env.*' \
            ./ "$FTP_REMOTE_DIR/"

          bye

          EOF

          echo "DEPLOYMENT SUCCESSFUL."

  # ========================================
  # 4. FINAL SUMMARY
  # ========================================

  summary:
    name: CI/CD Summary
    needs: [test, rollback, deploy]

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Display Results
        env:
          TEST: ${{ needs.test.outputs.result }}
          ROLLBACK: ${{ needs.rollback.result }}
          DEPLOY: ${{ needs.deploy.result }}

        run: |
          {
            echo "# PHP CI/CD SUMMARY"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| PHP Test | $TEST |"
            echo "| Rollback | $ROLLBACK |"
            echo "| Deployment | $DEPLOY |"
            echo ""
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "================================"
          echo "FINAL CI/CD RESULTS"
          echo "================================"

          echo "PHP TEST: $TEST"
          echo "ROLLBACK: $ROLLBACK"
          echo "DEPLOYMENT: $DEPLOY"
