
name: PHP CI/CD - InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infinityfree-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test Pushed PHP Files
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.check.outputs.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test PHP Files
        id: check
        shell: bash
        run: |
          FAILED=0
          COUNT=0

          FILES=$(git diff-tree --no-commit-id \
            --name-only -r "$GITHUB_SHA" -- '*.php')

          if [ -z "$FILES" ]; then
            echo "No PHP files changed."
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            if php -l "$FILE"; then
              echo "PASS: $FILE"
            else
              echo "FAILED: $FILE"
              FAILED=1
            fi
          done <<< "$FILES"

          echo "Files tested: $COUNT"

          if [ "$FAILED" -eq 1 ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "result=passed" >> "$GITHUB_OUTPUT"

  rollback:
    name: Rollback Failed Files
    needs: test
    if: failure() && needs.test.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Previous PHP Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          FAILED_FILES=$(git diff-tree --no-commit-id \
            --name-only -r "$GITHUB_SHA" -- '*.php')

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if git cat-file -e "$GITHUB_SHA^:$FILE" 2>/dev/null; then
              git restore --source="$GITHUB_SHA^" \
                --staged --worktree -- "$FILE"
            else
              git rm -f --ignore-unmatch "$FILE"
            fi
          done <<< "$FAILED_FILES"

          if ! git diff --cached --quiet; then
            git commit -m "Rollback failed PHP files [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    name: Deploy Passed Files
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTP Client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to InfinityFree
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set net:timeout 30
          set net:max-retries 3

          mirror --reverse \
            --verbose \
            --overwrite \
            --no-perms \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob .env \
            --exclude-glob '.env.*' \
            ./ "$FTP_REMOTE_DIR/"

          bye
          EOF

  summary:
    name: CI/CD Summary
    needs: [test, rollback, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Show Summary
        run: |
          {
            echo "## PHP CI/CD Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| PHP Test | ${{ needs.test.result }} |"
            echo "| Rollback | ${{ needs.rollback.result }} |"
            echo "| Deployment | ${{ needs.deploy.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
